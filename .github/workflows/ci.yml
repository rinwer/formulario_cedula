name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Chequeo de tipos (tsc)
        run: npx tsc --noEmit
      - name: Build (vite)
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # main.py exige estas variables al importarse; create_client no
      # hace ninguna llamada de red al construirse, asi que un valor
      # cualquiera alcanza para correr las pruebas sin un proyecto real.
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: test-service-role-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Chequeo de sintaxis
        run: python -m py_compile main.py
      - name: Pruebas (pytest)
        run: pytest -v
